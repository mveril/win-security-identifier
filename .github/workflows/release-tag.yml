name: Create Release Tag

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create tag from release branch
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Tag Name
        id: version
        shell: bash
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          RAW_VERSION="${BRANCH_NAME#release/}"

          if [[ "$RAW_VERSION" == *"+"* ]]; then
            echo "Error: Build metadata (+...) is not allowed in release branch names."
            exit 1
          fi

          if [[ "$RAW_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z\.-]+))?$ ]]; then
            echo "tag_name=v${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Branch name does not contain a valid SemVer version. Current branch: $BRANCH_NAME"
            exit 1
          fi

      - name: Ensure Tag Does Not Exist
        shell: bash
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git fetch --tags --force
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag '$TAG_NAME' already exists."
            exit 1
          fi

      - name: Create and Push Tag
        shell: bash
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
