name: Tag on Merge and Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  determine-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.determine.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag to use
        id: determine
        shell: bash
        run: |
          echo "Event: ${GITHUB_EVENT_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
              echo "PR merged, creating tag..."
              branch="${GITHUB_HEAD_REF}"
              if [[ "$branch" != release/* ]]; then
                echo "Branch '$branch' is not a release branch. Skipping deployment."
                echo "tag=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              version="${branch#release/}"
              if [ -z "$version" ]; then
                echo "Error: Extracted version is empty."
                exit 1
              fi
              tag="v${version}"
              echo "Creating tag: $tag"
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git tag "$tag" -a -m "Release version $version"
              git push origin "$tag"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
            else
              echo "PR not merged. Doing nothing."
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "Push event detected."
            tag="${GITHUB_REF#refs/tags/}"
            if [ -z "$tag" ]; then
              echo "Error: TAG value from push event is empty."
              exit 1
            fi
            echo "Using pushed tag: $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Unsupported event '${GITHUB_EVENT_NAME}'."
            exit 1
          fi

  validate-and-release:
    if: ${{ needs.determine-tag.outputs.tag_name != '' }}
    needs: determine-tag
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.determine-tag.outputs.tag_name }}
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - name: Validate TAG_NAME presence
        shell: bash
        run: |
          if [ -z "${TAG_NAME}" ]; then
            echo "TAG_NAME is empty. Aborting deployment."
            exit 1
          fi
          echo "TAG_NAME=${TAG_NAME}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Rust toolchain (stable)
        shell: bash
        run: |
          rustup set profile minimal
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo registry and git index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Parse and validate SemVer (no build metadata allowed)
        id: semver
        shell: bash
        run: |
          RAW="${TAG_NAME#v}"

          # Fail if build metadata is present (e.g., +exp.sha)
          if [[ "$RAW" == *"+"* ]]; then
            echo "Error: Build metadata (+...) is not allowed in tags."
            exit 1
          fi

          # SemVer: MAJOR.MINOR.PATCH[-PRERELEASE]
          if [[ "$RAW" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z\.-]+))?$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            PRERELEASE_PART="${BASH_REMATCH[5]}"
            if [ -n "$PRERELEASE_PART" ]; then
              PRERELEASE="true"
              VERSION_FULL="${VERSION}-${PRERELEASE_PART}"
            else
              PRERELEASE="false"
              VERSION_FULL="${VERSION}"
            fi
          else
            echo "Error: Tag '${TAG_NAME}' is not a valid SemVer (expected vMAJOR.MINOR.PATCH[-PRERELEASE])."
            exit 1
          fi

          echo "version=${VERSION_FULL}" >> "$GITHUB_ENV"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_ENV"

      - name: Detect previous release tag
        id: release_history
        shell: bash
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Previous release tag: $PREVIOUS_TAG"
            echo "has_previous_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "No previous release tag found. Generated release notes will be skipped."
            echo "has_previous_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify workspace versions match tag
        shell: bash
        env:
          METADATA_PATH: ${{ runner.temp }}/metadata.json
        run: |
          cargo generate-lockfile || true
          cargo metadata --format-version 1 --no-deps > "${METADATA_PATH}"

          python - <<'PY'
          import json
          import os
          import sys

          expected = os.environ["version"]

          with open(os.environ["METADATA_PATH"], encoding="utf-8") as fh:
              metadata = json.load(fh)

          workspace_members = set(metadata["workspace_members"])
          errors = []

          for package in metadata["packages"]:
              if package["id"] not in workspace_members:
                  continue
              if package.get("publish") is False:
                  continue
              if package["version"] != expected:
                  errors.append(
                      f"Publishable crate '{package['name']}' has version "
                      f"'{package['version']}', expected '{expected}'."
                  )

          if errors:
              for error in errors:
                  print(f"ERROR: {error}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Sanity checks (fmt, clippy, build, test)
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo build --workspace --all-features
          cargo test --workspace --all-features --all-targets -- --nocapture

      - name: Cargo publish dry-run (crates.io)
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --workspace --dry-run --locked

      - name: Cargo publish (crates.io)
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_if_missing() {
            local package="$1"
            local url="https://crates.io/api/v1/crates/${package}/${version}"
            local status

            status="$(curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --user-agent 'win-security-identifier-release-workflow (https://github.com/mveril/win-security-identifier)' \
              "$url")"
            case "$status" in
              200)
                echo "${package} ${version} is already published; skipping."
                ;;
              404)
                cargo publish --package "$package" --locked
                ;;
              *)
                echo "Error: crates.io returned HTTP ${status} for ${package} ${version}."
                exit 1
                ;;
            esac
          }

          publish_if_missing "win-security-identifier-parsing"
          publish_if_missing "win-security-identifier-macro"
          publish_if_missing "win-security-identifier"

      - name: Create GitHub Release
        id: ghrel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.prerelease == 'true' && 'Prerelease' || 'Release' }} ${{ env.TAG_NAME }}
          body: |
            `win-security-identifier` ${{ env.TAG_NAME }} is available on crates.io.

            ## Installation

            ```console
            cargo add win-security-identifier@${{ env.version }}
            ```

            ## Links

            - [Crate on crates.io](https://crates.io/crates/win-security-identifier/${{ env.version }})
            - [Documentation on docs.rs](https://docs.rs/win-security-identifier/${{ env.version }})

          generate_release_notes: ${{ steps.release_history.outputs.has_previous_tag == 'true' }}
          prerelease: ${{ env.prerelease == 'true' }}
