name: Bug report
description: Report a reproducible bug in SID parsing, formatting, APIs, macros, or docs.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide a minimal reproduction and include environment details, especially if the issue is specific to Windows.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: checkboxes
    id: components
    attributes:
      label: Components involved
      description: Select the areas that seem affected.
      options:
        - label: Public API
        - label: Parsing
        - label: Proc macro
        - label: Windows-only API
        - label: Unsafe code
        - label: Serialization
        - label: Documentation
        - label: CI / release workflow

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps needed to reproduce the problem.
      placeholder: |
        1. Build with ...
        2. Parse or construct SID ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead? Include error messages, logs, or screenshots if relevant.
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2, Ubuntu 24.04, macOS 15
    validations:
      required: true

  - type: input
    id: rust_toolchain
    attributes:
      label: Rust toolchain
      description: Use `rustup show active-toolchain`.
      placeholder: stable-x86_64-pc-windows-msvc
    validations:
      required: true

  - type: input
    id: rust_version
    attributes:
      label: Rust version
      description: Use `rustc --version`.
      placeholder: rustc 1.94.0
    validations:
      required: true

  - type: input
    id: crate_version
    attributes:
      label: Crate version or commit
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: features
    attributes:
      label: Enabled features
      placeholder: default, std, alloc, macro, serde
    validations:
      required: false

  - type: textarea
    id: other_remarks
    attributes:
      label: Other remarks
      placeholder: Any extra details that would help diagnose the issue.
